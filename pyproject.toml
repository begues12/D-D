[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-engine"
version = "0.1.0"
description = "Motor de dominio para ejecutar aventuras de D&D"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Un extra por casa de IA; `ai` instala la de por defecto.
ai = ["anthropic>=1.0"]
anthropic = ["anthropic>=1.0"]

[project.scripts]
dnd-play = "dnd_engine.console:main"
dnd-demo = "dnd_engine.cli:main"
dnd-gui = "dnd_engine.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
